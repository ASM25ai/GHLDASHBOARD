name: Sync GHL Qualified Leads

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync qualified leads
        continue-on-error: true
        run: |
          curl -sS -f \
            "${{ secrets.VERCEL_SYNC_URL }}?secret=${{ secrets.CRON_SECRET }}"

      - name: Sync daily leads breakdown
        continue-on-error: true
        run: |
          curl -sS -f \
            "${{ secrets.VERCEL_DAILY_LEADS_URL }}?secret=${{ secrets.CRON_SECRET }}"

      - name: Sync call/SMS stats
        continue-on-error: true
        run: |
          curl -sS -f \
            "${{ secrets.VERCEL_CALLS_URL }}?secret=${{ secrets.CRON_SECRET }}"
